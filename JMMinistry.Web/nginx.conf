events { }
   http {
      include mime.types;
      types {
         application/wasm wasm;
       }
     server {
        listen 80;
        index index.html;

        root /var/www/web;

        # index.html must never be cached - it references hashed assets
        location = /index.html {
           add_header Cache-Control "no-cache, no-store, must-revalidate";
           try_files $uri =404;
        }

        # Service worker files must always revalidate
        location = /service-worker.js {
           add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location = /service-worker-assets.js {
           add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # PWA manifest should revalidate
        location = /manifest.webmanifest {
           add_header Cache-Control "no-cache";
        }

        # Hashed static assets (_framework/) can be cached long-term
        location /_framework/ {
           add_header Cache-Control "public, max-age=31536000, immutable";
           try_files $uri =404;
        }

        # All other requests
        location / {
           add_header Cache-Control "no-cache";
           try_files $uri $uri/ /index.html =404;
        }
     }
}
