events {
    worker_connections 1024;
}
   http {
      include mime.types;

      sendfile on;
      tcp_nopush on;
      tcp_nodelay on;
      keepalive_timeout 65;

      # Dynamic gzip compression
      gzip on;
      gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/wasm;
      gzip_min_length 256;

     server {
        listen 80;
        index index.html;

        root /var/www/web;

        # index.html must never be cached - it references hashed assets
        location = /index.html {
           add_header Cache-Control "no-cache, no-store, must-revalidate";
           try_files $uri =404;
        }

        # Service worker files must always revalidate
        location = /service-worker.js {
           add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location = /service-worker-assets.js {
           add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # PWA manifest should revalidate
        location = /manifest.webmanifest {
           add_header Cache-Control "no-cache";
        }

        # Boot manifest changes every build but has no content hash in the filename
        location = /_framework/blazor.boot.json {
           add_header Cache-Control "no-cache, no-store, must-revalidate";
           try_files $uri =404;
        }

        # Fingerprinted framework assets (name.hash.ext) can be cached long-term
        location ~ ^/_framework/.+\.[a-z0-9]{8,}\.(js|wasm|dll|blat|dat|css)$ {
           add_header Cache-Control "public, max-age=31536000, immutable";
           try_files $uri =404;
        }

        # Non-fingerprinted framework assets (dotnet.js, blazor.webassembly.js, etc.)
        location /_framework/ {
           add_header Cache-Control "no-cache";
           try_files $uri =404;
        }

        # All other requests
        location / {
           add_header Cache-Control "no-cache";
           try_files $uri $uri/ /index.html =404;
        }
     }
}
