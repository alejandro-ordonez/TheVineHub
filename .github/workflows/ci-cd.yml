name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test-api:
    name: Run API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/TheVineHub.sln

      - name: Build
        run: dotnet build backend/TheVineHub.sln --no-restore

      - name: Test
        run: dotnet test backend/TheVineHub.sln --no-build --verbosity normal

  deploy:
    name: Deploy
    needs: test-api
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and deploy using Docker Compose
        run: |
          docker compose build
          # Add any docker compose up command if necessary, e.g. docker compose up -d
